ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    #x     , y     , z,
    #roll  , pitch , yaw,
    #vx    , vy    , vz,
    #vroll , vpitch, vyaw,
    #ax    , ay    , az
    odom0: odom/unfiltered
    odom0_config: [
        false, # x
        false, # y
        false, # z
        false, # roll
        false, # pitch
        false, # yaw
        true, # vx
        true, # vy
        false, # vz
        false, # vroll
        false, # vpitch
        false, # vyaw
        false, # ax
        false, # ay
        false, # az
      ]

    imu0: imu/data_raw
    imu0_config: [
        false, # x
        false, # y
        false, # z
        false, # roll
        false, # pitch
        true, # yaw
        false, # vx
        false, # vy
        false, # vz
        false, # vroll
        false, # vpitch
        false, # vyaw
        false, # ax
        false, # ay
        false, # az
      ]
